# Push to main = deploy to Cloudflare Pages (site, Command Center and the Edge functions).
#
# No PC needs a Cloudflare sign-in for a code deploy once two repository secrets exist
# (GitHub, repository Settings, Secrets and variables, Actions):
#   CLOUDFLARE_API_TOKEN   an API token with Account permissions:
#                            - Cloudflare Pages: Edit
#                            - Workers R2 Storage: Edit
#                            - D1: Edit
#                          and optional Zone permissions on `isabisystems.com` (for edge redirect,
#                          email-obfuscation disable, and post-deploy CDN cache purge):
#                            - Zone: Read
#                            - Zone Settings: Edit
#                            - Dynamic Redirect: Edit
#                            - Cache Purge: Purge
#   CLOUDFLARE_ACCOUNT_ID  the account id shown on the Cloudflare dashboard overview
# Until both exist this workflow runs the checks and stops with a notice; nothing fails.
#
# What it does: verifies or uploads private R2 ledger seeds (`isabi-vault/seeds/seed_*.json`),
# applies idempotent D1 schema migrations (`migrations/0001_schema.sql`), and deploys Pages.
# Full ledger data top-ups stay with build/deploy_cloudflare.py.
name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  # write: the run takes the release lock (the ref refs/locks/release; build/release_lock.py). Nothing else is pushed.
  # The token is not kept in .git/config (persist-credentials: false); only the three release-lock steps get it.
  contents: write

concurrency:
  group: cloudflare-pages-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30  # up to 10 of them waiting for a session's release lock
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          # History (without file contents) so the release lock check can tell whether a session's live deploy is
          # part of this commit.
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Offline checks (nothing live is touched)
        shell: bash
        run: |
          set -euo pipefail
          node --check functions/_middleware.js
          node --check functions/_lib/kiosk_verify.js
          node --check functions/_lib/d1_store.js
          node --check build/verify_live_parity.mjs
          node --check build/_release_log.mjs
          node --no-warnings build/verify_release_log_sync.mjs
          python3 build/verify_deploy_cli.py
          python3 build/verify_version_claims.py
          python3 build/verify_release_lock.py
          node --check build/verify_cloudflare_edge.mjs
          # The log goes outside the checkout: everything in the checkout is what gets deployed.
          node --no-warnings build/verify_kiosk_cloud.mjs > "$RUNNER_TEMP/kiosk-checks.log" || { tail -n 40 "$RUNNER_TEMP/kiosk-checks.log"; exit 1; }
          tail -n 1 "$RUNNER_TEMP/kiosk-checks.log"

      # Its own step with its own limit: this gate runs many hundreds of git commands against local bare
      # repositories. A slow or hung run stops here after 10 minutes (the job then fails without deploying)
      # instead of using up the time the job needs to wait for the release lock and deploy.
      - name: Batched release gate (build/release_batch.py, offline)
        timeout-minutes: 10
        run: python3 build/verify_release_batch.py

      - name: Shell version in this commit
        id: ver
        run: echo "sw=$(head -n 1 app/sw.js)" >> "$GITHUB_OUTPUT"

      - name: Not deployed, the Cloudflare secrets are not set on this repository
        if: env.CLOUDFLARE_API_TOKEN == '' || env.CLOUDFLARE_ACCOUNT_ID == ''
        run: echo "::notice::Checks passed. Add CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID as repository secrets to deploy on push."

      # One release at a time (build/release_lock.py): this run is a lock holder like any session. It waits up to
      # 10 minutes for a session's release to finish, then takes the lock and records this commit; when the lock stays
      # held, nothing below goes live (a warning: that session deploys a commit containing main). An expired lock whose
      # live deploy is not part of this commit fails the run (deploying would roll that work back).
      # Production deploys come from main only (a dispatch on another branch runs the checks and stops here).
      - name: Release lock
        id: lock
        if: env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != '' && github.ref == 'refs/heads/main'
        env:
          GH_LOCK_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          export GIT_CONFIG_COUNT=1 GIT_CONFIG_KEY_0="http.https://github.com/.extraheader"
          export GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_LOCK_TOKEN" | base64 -w0)"
          python3 build/release_lock.py ci-acquire --sha "$GITHUB_SHA" --wait 600 --holder "GitHub Actions run ${{ github.run_id }}"

      - name: Stage allowlisted Pages bundle
        shell: bash
        run: |
          set -euo pipefail
          python3 build/stage_pages_bundle.py "$RUNNER_TEMP/pages-bundle"

      - name: Upload or verify private ledger seeds in R2
        if: env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != '' && steps.lock.outputs.deploy == 'true'
        shell: bash
        run: |
          set -euo pipefail
          for kind in core records industries; do
            uploaded=0
            for candidate in "../isabi-app/js/seed_${kind}.json" "app/js/seed_${kind}.json"; do
              if [ -f "$candidate" ]; then
                npx --yes wrangler@4 r2 object put "isabi-vault/seeds/seed_${kind}.json" --file="$candidate" --content-type="application/json" --remote
                uploaded=1
                break
              fi
            done
            if [ "$uploaded" -eq 0 ]; then
              chk_file="$RUNNER_TEMP/seed_chk_${kind}.json"
              rm -f "$chk_file"
              npx --yes wrangler@4 r2 object get "isabi-vault/seeds/seed_${kind}.json" --file="$chk_file" --remote
              if [ ! -s "$chk_file" ]; then
                echo "::error::Missing or empty private R2 snapshot isabi-vault/seeds/seed_${kind}.json; run build/deploy_cloudflare.py once to populate R2 before deploying."
                exit 1
              fi
              rm -f "$chk_file"
            fi
          done

      - name: Apply idempotent D1 schema migrations
        if: env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != '' && steps.lock.outputs.deploy == 'true'
        run: npx --yes wrangler@4 d1 execute isabi-ledger --remote --file=migrations/0001_schema.sql

      - name: Release lock still held
        if: env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != '' && steps.lock.outputs.deploy == 'true'
        env:
          GH_LOCK_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          export GIT_CONFIG_COUNT=1 GIT_CONFIG_KEY_0="http.https://github.com/.extraheader"
          export GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_LOCK_TOKEN" | base64 -w0)"
          python3 build/release_lock.py renew --ttl 30

      - name: Deploy
        if: env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != '' && steps.lock.outputs.deploy == 'true'
        run: npx --yes wrangler@4 pages deploy "$RUNNER_TEMP/pages-bundle" --project-name=isabi-systems --branch=main --commit-hash="$GITHUB_SHA" --commit-dirty=true

      - name: Give the release lock back
        if: always() && steps.lock.outputs.deploy == 'true'
        env:
          GH_LOCK_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -uo pipefail
          export GIT_CONFIG_COUNT=1 GIT_CONFIG_KEY_0="http.https://github.com/.extraheader"
          export GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_LOCK_TOKEN" | base64 -w0)"
          for i in 1 2 3; do python3 build/release_lock.py release && exit 0; sleep 15; done
          echo "::error::Could not give the release lock back; it expires 40 minutes after this run's last renew."
          exit 1

      - name: Live probe
        if: env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != '' && steps.lock.outputs.deploy == 'true'
        env:
          WANT_SW: ${{ steps.ver.outputs.sw }}
        shell: bash
        run: |
          set -eu
          live=""
          for i in 1 2 3 4 5 6; do
            sleep 10
            live="$(curl -fsS -H 'Cache-Control: no-cache' "https://isabisystems.com/app/sw.js?probe=$GITHUB_SHA" 2>/dev/null | head -n 1 | tr -d '\r' || true)"
            if [ "$live" = "$WANT_SW" ]; then break; fi
          done
          echo "live:   $live"
          echo "commit: $WANT_SW"
          [ "$live" = "$WANT_SW" ] || { echo "::error::The live app is not the version in this commit."; exit 1; }
          # Read-only health check of the Edge functions + full headless 6-industry live parity & security gate.
          code="$(curl -s -o /dev/null -w '%{http_code}' https://isabisystems.com/app/api/status)"
          [ "$code" = "200" ] || { echo "::error::The Edge API status check answered $code; expected 200."; exit 1; }
          python3 build/deploy_cloudflare.py --configure-domain
          node --no-warnings build/verify_live_parity.mjs
          python3 build/deploy_cloudflare.py --ping-indexnow
          echo "The live app is the version in this commit and passed the full live parity gate."
