# A push to main runs the offline checks here and deploys NOTHING (owner 2026-11-26: "it should deploy without a
# github action"). The release leader's PC deploys under the Cloudflare release lock:
#   python build/deploy_cloudflare.py --pages-only      (then push isabi-app and isabi main, release_batch.py done)
# so a GitHub outage or a red run here never stops a release; GitHub is the code backup.
#
# Emergency only (no PC can deploy): run this workflow by hand on main with "deploy" ticked. It then takes the same
# release lock and deploys main as it used to on every push. That needs two repository secrets
# (GitHub, repository Settings, Secrets and variables, Actions):
#   CLOUDFLARE_API_TOKEN   an API token with Account permissions:
#                            - Cloudflare Pages: Edit
#                            - Workers R2 Storage: Edit
#                            - D1: Edit
#                          and optional Zone permissions on `isabisystems.com` (for edge redirect,
#                          email-obfuscation disable, and post-deploy CDN cache purge):
#                            - Zone: Read
#                            - Zone Settings: Edit
#                            - Dynamic Redirect: Edit
#                            - Cache Purge: Purge
#   CLOUDFLARE_ACCOUNT_ID  the account id shown on the Cloudflare dashboard overview
# Until both exist a dispatch with "deploy" ticked runs the checks and stops with a notice; nothing fails.
#
# What the emergency deploy does: verifies or uploads private R2 ledger seeds (`isabi-vault/seeds/seed_*.json`),
# applies idempotent D1 schema migrations (`migrations/0001_schema.sql`), and deploys Pages.
# Full ledger data top-ups stay with build/deploy_cloudflare.py.
name: Checks on main (deploys only on a manual emergency dispatch)

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      deploy:
        description: "Emergency only: deploy main from this runner (normally the release leader's PC deploys)"
        type: boolean
        default: false

permissions:
  # read: release lock lives in Cloudflare Durable Object (IsabiReleaseRoom); CI never pushes refs to GitHub.
  contents: read

# Only an emergency deploy queues in the shared group. A checks-only run gets a group of its own: GitHub keeps one
# waiting run per group and cancels the older one, so a push must never be able to push a waiting deploy out.
concurrency:
  group: ${{ (github.event_name == 'workflow_dispatch' && inputs.deploy) && 'cloudflare-pages-production' || format('checks-{0}', github.run_id) }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 40  # up to 10 of them waiting for a session's release lock; the two batch gates have 10 each
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          # History (without file contents) so the release lock check can tell whether a session's live deploy is
          # part of this commit.
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Offline checks (nothing live is touched)
        shell: bash
        run: |
          set -euo pipefail
          node --check functions/_middleware.js
          node --check functions/_lib/kiosk_verify.js
          node --check functions/_lib/d1_store.js
          node --check functions/_lib/web_push.js
          node --check build/_headless_browser.mjs
          node --check build/verify_live_parity.mjs
          node --no-warnings build/verify_parity_browser.mjs
          node --no-warnings build/verify_live_parity.mjs --smoke-browser
          node --check build/_release_log.mjs
          node --no-warnings build/verify_release_log_sync.mjs
          python3 build/verify_deploy_cli.py
          # The checks a PC deploy relies on: Edge entry files parse, the schema file can run on every deploy.
          python3 build/verify_deploy_preflight.py
          # A deploy never replaces the live signing secret unless asked (--rotate-secrets).
          python3 build/verify_jwt_secret_keep.py
          python3 build/verify_version_claims.py
          python3 build/verify_release_lock.py
          python3 build/verify_release_cloudflare.py
          python3 build/verify_r2_seed_parity.py
          node --check build/verify_cloudflare_edge.mjs
          # Build-ticket sign-in of the build scripts: the Edge check through the real router, and the script guard.
          node --no-warnings build/verify_build_ticket.mjs > "$RUNNER_TEMP/build-ticket-checks.log" || { tail -n 40 "$RUNNER_TEMP/build-ticket-checks.log"; exit 1; }
          tail -n 1 "$RUNNER_TEMP/build-ticket-checks.log"
          python3 build/verify_build_ticket_guard.py
          node --no-warnings build/verify_web_push_unit.mjs > "$RUNNER_TEMP/web-push-checks.log" || { tail -n 40 "$RUNNER_TEMP/web-push-checks.log"; exit 1; }
          tail -n 1 "$RUNNER_TEMP/web-push-checks.log"
          # The log goes outside the checkout: everything in the checkout is what gets deployed.
          node --no-warnings build/verify_kiosk_cloud.mjs > "$RUNNER_TEMP/kiosk-checks.log" || { tail -n 40 "$RUNNER_TEMP/kiosk-checks.log"; exit 1; }
          tail -n 1 "$RUNNER_TEMP/kiosk-checks.log"

      # Its own step with its own limit: this gate runs many hundreds of git commands against local bare
      # repositories. A slow or hung run stops here after 10 minutes (the job then fails without deploying)
      # instead of using up the time the job needs to wait for the release lock and deploy.
      - name: Batched release gate (build/release_batch.py, offline)
        timeout-minutes: 10
        run: python3 build/verify_release_batch.py

      # One or a few changes per batch (owner 2026-11-25): the size limit, the leader's own change, stacked changes.
      - name: Batch size limit gate (build/release_batch.py, offline)
        timeout-minutes: 10
        run: python3 build/verify_release_batch_cap.py

      # The limit follows the line (3, or 6 while more than 6 wait), `lead` (one batch, one command) and `drive`
      # (batch after batch until the line is empty) (owner 2026-11-26).
      - name: Release leader and driver gate (build/release_batch.py lead / drive, offline)
        timeout-minutes: 10
        run: python3 build/verify_release_lead.py

      - name: Shell version in this commit
        id: ver
        run: echo "sw=$(head -n 1 app/sw.js)" >> "$GITHUB_OUTPUT"

      - name: Not deployed, the Cloudflare secrets are not set on this repository
        if: (env.CLOUDFLARE_API_TOKEN == '' || env.CLOUDFLARE_ACCOUNT_ID == '') && github.event_name == 'workflow_dispatch' && inputs.deploy
        run: echo "::notice::Checks passed. Add CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID as repository secrets for an emergency deploy from this runner."

      - name: Not deployed, an emergency deploy runs from main only
        if: github.event_name == 'workflow_dispatch' && inputs.deploy && github.ref != 'refs/heads/main'
        run: echo "::warning::deploy was ticked on a branch other than main. Nothing was deployed. Run the workflow on main."

      # One release at a time (build/release_lock.py): this run is a lock holder like any session. It waits up to
      # 10 minutes for a session's release to finish, then takes the lock and records this commit; when the lock stays
      # held, nothing below goes live (a warning: that session deploys a commit containing main). An expired lock whose
      # live deploy is not part of this commit fails the run (deploying would roll that work back).
      # Production deploys come from main only (a dispatch on another branch runs the checks and stops here), and only
      # from a manual dispatch with "deploy" ticked: a push never takes the lock, so every step below is skipped on it.
      - name: Release lock
        id: lock
        if: env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != '' && github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch' && inputs.deploy
        shell: bash
        run: python3 build/release_lock.py ci-acquire --sha "$GITHUB_SHA" --wait 600 --holder "GitHub Actions run ${{ github.run_id }}"

      - name: Stage allowlisted Pages bundle
        shell: bash
        run: |
          set -euo pipefail
          python3 build/stage_pages_bundle.py "$RUNNER_TEMP/pages-bundle"

      - name: Upload or verify private ledger seeds in R2
        if: env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != '' && steps.lock.outputs.deploy == 'true'
        shell: bash
        run: |
          set -euo pipefail
          python3 build/verify_r2_seed_parity.py --check-manifest app/js/seed_manifest.js --app-dir app
          # Pass 1: validate every local or remote R2 seed before any upload mutates R2.
          for kind in core records industries; do
            found_local=0
            for candidate in "../isabi-app/js/seed_${kind}.json" "app/js/seed_${kind}.json"; do
              if [ -f "$candidate" ]; then
                python3 build/verify_r2_seed_parity.py --check-seed-file "$kind" "$candidate" --manifest app/js/seed_manifest.js
                found_local=1
                break
              fi
            done
            if [ "$found_local" -eq 0 ]; then
              chk_file="$RUNNER_TEMP/seed_chk_${kind}.json"
              rm -f "$chk_file"
              npx --yes wrangler@4 r2 object get "isabi-vault/seeds/seed_${kind}.json" --file="$chk_file" --remote
              if [ ! -s "$chk_file" ]; then
                echo "::error::Missing or empty private R2 snapshot isabi-vault/seeds/seed_${kind}.json; run build/deploy_cloudflare.py once to populate R2 before deploying."
                exit 1
              fi
              python3 build/verify_r2_seed_parity.py --check-seed-file "$kind" "$chk_file" --manifest app/js/seed_manifest.js
              rm -f "$chk_file"
            fi
          done
          # Pass 2: upload validated local seeds only after all 3 kinds passed.
          for kind in core records industries; do
            for candidate in "../isabi-app/js/seed_${kind}.json" "app/js/seed_${kind}.json"; do
              if [ -f "$candidate" ]; then
                npx --yes wrangler@4 r2 object put "isabi-vault/seeds/seed_${kind}.json" --file="$candidate" --content-type="application/json" --remote
                break
              fi
            done
          done

      - name: Apply idempotent D1 schema migrations
        if: env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != '' && steps.lock.outputs.deploy == 'true'
        run: npx --yes wrangler@4 d1 execute isabi-ledger --remote --file=migrations/0001_schema.sql

      - name: Release lock still held
        if: env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != '' && steps.lock.outputs.deploy == 'true'
        shell: bash
        run: python3 build/release_lock.py renew --ttl 30

      - name: Deploy
        if: env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != '' && steps.lock.outputs.deploy == 'true'
        run: npx --yes wrangler@4 pages deploy "$RUNNER_TEMP/pages-bundle" --project-name=isabi-systems --branch=main --commit-hash="$GITHUB_SHA" --commit-dirty=true

      - name: Give the release lock back
        if: always() && steps.lock.outputs.deploy == 'true'
        shell: bash
        run: |
          set -uo pipefail
          for i in 1 2 3; do python3 build/release_lock.py release && exit 0; sleep 15; done
          echo "::error::Could not give the release lock back; it expires 40 minutes after this run's last renew."
          exit 1

      - name: Live probe
        if: env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != '' && steps.lock.outputs.deploy == 'true'
        env:
          WANT_SW: ${{ steps.ver.outputs.sw }}
        shell: bash
        run: |
          set -eu
          live=""
          for i in 1 2 3 4 5 6; do
            sleep 10
            live="$(curl -fsS -H 'Cache-Control: no-cache' "https://isabisystems.com/app/sw.js?probe=$GITHUB_SHA" 2>/dev/null | head -n 1 | tr -d '\r' || true)"
            if [ "$live" = "$WANT_SW" ]; then break; fi
          done
          echo "live:   $live"
          echo "commit: $WANT_SW"
          [ "$live" = "$WANT_SW" ] || { echo "::error::The live app is not the version in this commit."; exit 1; }
          # Read-only health check of the Edge functions + full headless 6-industry live parity & security gate.
          code="$(curl -s -o /dev/null -w '%{http_code}' https://isabisystems.com/app/api/status)"
          [ "$code" = "200" ] || { echo "::error::The Edge API status check answered $code; expected 200."; exit 1; }
          python3 build/deploy_cloudflare.py --configure-domain
          node --no-warnings build/verify_live_parity.mjs
          python3 build/deploy_cloudflare.py --ping-indexnow
          echo "The live app is the version in this commit and passed the full live parity gate."
